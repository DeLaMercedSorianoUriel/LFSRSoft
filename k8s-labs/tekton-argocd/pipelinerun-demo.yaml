apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: build-and-deploy-run-1
  namespace: tekton-pipelines
spec:
  pipelineRef:
    name: build-and-deploy
  podTemplate:
    nodeSelector:
      kubernetes.io/hostname: worker02-proyecto
  params:
    - name: repo-url
      value: https://github.com/DeLaMercedSorianoUriel/LFSRSoft
    - name: revision
      value: Develop
    - name: image
      value: docker.io/uriel0331dls/lfsr-backend:v6
  workspaces:
    - name: shared-source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: nfs-csi
          resources:
            requests:
              storage: 500Mi
