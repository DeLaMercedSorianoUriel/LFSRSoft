apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: git-clone
  namespace: tekton-pipelines
spec:
  params:
    - name: url
      description: URL del repositorio Git
      type: string
    - name: revision
      description: Branch a clonar
      type: string
      default: Develop
  workspaces:
    - name: source
      description: Workspace donde se clona el repo
  steps:
    - name: clone
      image: alpine/git:latest
      script: |
        #!/bin/sh
        set -e
        echo "Clonando $(params.url) rama $(params.revision)"
        git clone --depth=1 --branch=$(params.revision) \
          $(params.url) $(workspaces.source.path)
        echo "Clone completado"
        ls $(workspaces.source.path)
