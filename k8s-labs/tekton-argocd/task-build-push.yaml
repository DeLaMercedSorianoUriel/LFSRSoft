apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-push
  namespace: tekton-pipelines
spec:
  params:
    - name: image
      description: "Imagen destino con tag. Ej: usuario/app:v1"
      type: string
    - name: context
      description: Directorio del Containerfile dentro del repo
      type: string
      default: "."
    - name: dockerfile
      description: Nombre del Dockerfile/Containerfile
      type: string
      default: "Containerfile"
  workspaces:
    - name: source
      description: Workspace con el codigo clonado
  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:latest
      args:
        - --dockerfile=$(workspaces.source.path)/$(params.context)/$(params.dockerfile)
        - --context=$(workspaces.source.path)/$(params.context)
        - --destination=$(params.image)
        - --insecure
        - --skip-tls-verify
      env:
        - name: DOCKER_CONFIG
          value: /kaniko/.docker
      volumeMounts:
        - name: docker-config
          mountPath: /kaniko/.docker
  volumes:
    - name: docker-config
      secret:
        secretName: docker-credentials
        items:
          - key: .dockerconfigjson
            path: config.json
