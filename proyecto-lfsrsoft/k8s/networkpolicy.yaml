# ============================================================
# POLITICA 1: Bloqueo total por defecto en el namespace
# Todo trafico entrante y saliente queda bloqueado
# Las siguientes politicas abren solo lo necesario
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: lfsrsoft
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# ============================================================
# POLITICA 2: Frontend puede recibir trafico externo
# Permite entrada desde cualquier origen al puerto 3000
# Es el unico pod expuesto al exterior
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: lfsrsoft
spec:
  podSelector:
    matchLabels:
      app: lfsr-frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000

---
# ============================================================
# POLITICA 3: Frontend puede hablar SOLO con el backend
# El frontend no puede ir a ningun otro lugar
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: lfsrsoft
spec:
  podSelector:
    matchLabels:
      app: lfsr-frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: lfsr-backend
      ports:
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: UDP
          port: 53

---
# ============================================================
# POLITICA 4: Backend recibe trafico SOLO del frontend
# Nadie mas puede llamar al backend directamente
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-ingress
  namespace: lfsrsoft
spec:
  podSelector:
    matchLabels:
      app: lfsr-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: lfsr-frontend
      ports:
        - protocol: TCP
          port: 8080

---
# ============================================================
# POLITICA 5: Backend puede hablar SOLO con PostgreSQL
# El backend no puede salir a internet ni a otros pods
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-postgres
  namespace: lfsrsoft
spec:
  podSelector:
    matchLabels:
      app: lfsr-backend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: UDP
          port: 53

---
# ============================================================
# POLITICA 6: PostgreSQL recibe trafico SOLO del backend
# El frontend NO puede llegar a postgres directamente
# Este es el punto clave del zero-trust del proyecto
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-from-backend-only
  namespace: lfsrsoft
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: lfsr-backend
      ports:
        - protocol: TCP
          port: 5432

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-initcontainer-to-postgres
  namespace: lfsrsoft
spec:
  podSelector:
    matchLabels:
      app: lfsr-backend
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.97.158.5/32
      ports:
        - protocol: TCP
          port: 5432

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: lfsrsoft
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: lfsrsoft
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
